<html xmlns="http://www.w3.org/1999/html">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=0, maximum-scale=1, user-scalable=yes, width=device-width">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='waitMe.min.css') }}">
        <script src="{{ url_for('static', filename='jquery-3.4.1.min.js') }}"></script>
        <script src="{{ url_for('static', filename='waitMe.min.js') }}"></script>
        <title>App</title>

    </head>
    <script>
            $(document).ready(function () {
                $('#access-password').click(function(){
                    var password = $("#password").val();
                    $.ajax
                    ({
                        url: '/api/requesttoken',
                        data: {"password": password},
                        type: 'post',
                        success: function(result)
                        {
                            if(!result['ok']) {
                                  $("#msg-box").addClass("error");
                                $("#msg-box #msg-box-txt").text(result['message']);
                                $("#msg-box").animate({
                                    opacity: 1
                                });
                                setTimeout(function(){
                                    $("#msg-box").animate({
                                        opacity: 0
                                    });
                                    $("#msg-box").removeClass("error");
                                    $("#msg-box span#msg-box-txt").text('');
                                },3000);
                            }
                            if(result['ok']) {
                               $('#main-mid').waitMe({
                                    effect : 'rotateplane',
                                    text : 'Token wird erstellt...',
                                    bg : 'rgba(255,255,255,0.7)',
                                    color : '#000'
                                });
                                setTimeout(function(){ window.location.href='/onboarding/devices'; }, 3000);
                            }
                            var password = ""
                        }
                    });
                });
            });
        </script>

  <body>
        <div id="main">
            <div id="main-head">
                <div class="header">
                    <h3>Access</h3>
                </div>
            </div>
            <div id="main-mid">
                <p class="beschreibung">Um der HomeKit-Bridge Zugriff auf Dein digitalStrom zu gewähren, muss ein Token erstellt werden. Dabei wird auf dem dSS ein eindeutiger Token angelegt. Dieser Token wird auch nur lokal in Deinem Netzwerk benutzt.</p>
                <p class="beschreibung">Geb bitte das Password für den Standardbenutzer 'dssadmin' ein:</p>
                <input type="password" id="password" class="forms" placeholder="Passwort....">
                <div id="msg-box" style="opacity: 0;">
                    <span id="msg-box-txt"></span>
                </div>
            </div>
            <div id="main-bottom">
                <input type="button" id="access-password" class="button-green forms" value="Weiter ...">
            </div>
        </div>

  </body>
</html>
