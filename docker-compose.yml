version: '3.8'

services:
  dsbridge:
    # Uncomment the build section to build the image locally
#    build:
#      context: .
#      dockerfile: Dockerfile
    container_name: dsbridge
    restart: unless-stopped
    # Use image from GitHub Container Registry instead of building locally
    # Comment the following line to not use the pre-built image
    image: ghcr.io/mohanisch/digitalstrom-homekit-bridge:latest
    # Use host network mode for HomeKit/mDNS to work properly
    # HomeKit requires mDNS/Bonjour which works best with host networking
    network_mode: host
    volumes:
      # Persist configuration and pairing data
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DSS_VERIFY_SSL=false
      - DSS_HOSTNAME=<YOUR_DSS_HOSTNAME_OR_IP>
    # Alternative: Use bridge network if host mode is not desired
    # Uncomment the following lines and comment out network_mode: host above
    # ports:
    #   - "8081:8081"
    # networks:
    #   - dsbridge-net
    # Extra hosts for mDNS (if using bridge network)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

# Uncomment if using bridge network instead of host mode
# networks:
#   dsbridge-net:
#     driver: bridge
